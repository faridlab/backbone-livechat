# Livechat Module Configuration
#
# Generated by metaphor-schema. Customize as needed.
#
# Override settings per environment:
#   - application-dev.yml for development
#   - application-prod.yml for production

server:
  host: 0.0.0.0
  port: 3000
  grpc_port: 50051

database:
  # PostgreSQL connection
  url: postgresql://root:password@localhost:5432/livechat
  max_connections: 20
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600

module:
  name: livechat
  enabled: true

features:
  soft_delete: true
  state_machines: false
  workflows: false

entities:
  channel:
    collection: channels
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  channel_member:
    collection: channel_members
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  channel_rule:
    collection: channel_rules
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  chatbot_answer:
    collection: chatbot_answers
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  chatbot_message:
    collection: chatbot_messages
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  chatbot_script:
    collection: chatbot_scripts
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  chatbot_step:
    collection: chatbot_steps
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  chatbot_step_trigger:
    collection: chatbot_step_triggers
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  conversation_tag:
    collection: conversation_tags
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  expertise_tag:
    collection: expertise_tags
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  livechat_audit_log:
    collection: livechat_audit_log
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  member_history:
    collection: member_histories
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  operator_expertise:
    collection: operator_expertise
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  operator_profile:
    collection: operator_profiles
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  rating:
    collection: ratings
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  session:
    collection: sessions
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  session_tag:
    collection: session_tags
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100

logging:
  level: info
  format: json
  file: logs/livechat.log

tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317

metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
