# =============================================================================
# livechat — the conversation tag vocabulary: ConversationTag (LC-19).
#
# PORT DECISIONS: canonical, non-translated, case-insensitive —
# The case-insensitive namespace ('Bug'/'bug' cannot coexist) is an
# org-scoped expression unique re-declared by the composing tenancy
# decorator (ADR-0029). Deleting a tag is a plain FK cascade off session_tags — there
# are no denormalized display names to resync, so upstream's sudo pre-delete
# resync hack has no equivalent to keep. The random kanban color default is
# dropped.
# =============================================================================

models:

  - name: ConversationTag
    collection: conversation_tags
    description: "ConversationTag — a company's canonical conversation label: case-insensitive unique per org unit (decorator-declared). Deleting a tag cascades its session_tags rows (plain FK cascade)."
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique record id"
      name:
        type: string
        attributes: ["@required", "@max(120)"]
        description: "The canonical label (case-insensitive unique per org unit)."
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
