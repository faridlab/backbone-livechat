# =============================================================================
# livechat — the conversation tag vocabulary: ConversationTag (LC-19).
#
# PORT DECISIONS: canonical, non-translated, case-insensitive —
# UNIQUE(company_id, lower(name)) lands in hardening ('Bug'/'bug' cannot
# coexist). Deleting a tag is a plain FK cascade off session_tags — there
# are no denormalized display names to resync, so upstream's sudo pre-delete
# resync hack has no equivalent to keep. The random kanban color default is
# dropped.
# =============================================================================

models:

  - name: ConversationTag
    collection: conversation_tags
    description: "ConversationTag — a company's canonical conversation label: UNIQUE(company_id, lower(name)) (hardening expression unique). Deleting a tag cascades its session_tags rows (plain FK cascade)."
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique record id"
      name:
        type: string
        attributes: ["@required", "@max(120)"]
        description: "The canonical label (case-insensitive unique per company)."
      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check", "@indexed"]
        description: "Owning company (strict fence — logical corporate ref)."
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
