# =============================================================================
# livechat — the expertise vocabulary: ExpertiseTag.
#
# PORT DECISIONS (SPEC.md §7.4, LC-14): upstream carried a translated-JSONB
# name with a case-sensitive namespace. The port is canonical,
# non-translated, case-insensitive: the expression unique over lower(name)
# is re-declared org-scoped by the composing tenancy decorator (ADR-0029) — 'Bug'/'BUG'/'bug' cannot
# coexist within an org unit.
# =============================================================================

models:

  - name: ExpertiseTag
    collection: expertise_tags
    description: "ExpertiseTag — a company's canonical expertise label: case-insensitive unique per org unit (decorator-declared). Labels, not ids, freeze onto ledger rows and forward steps (deterministic reporting, no translation mining)."
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique record id"
      name:
        type: string
        attributes: ["@required", "@max(120)"]
        description: "The canonical label (case-insensitive unique per org unit)."
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      operators:
        type: OperatorExpertise[]
        attributes: ["@one_to_many", "@foreign_key(expertise_tag_id)", "@restrict"]
        description: "The operators bound to this expertise"
